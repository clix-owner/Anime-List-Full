name: Build Fribb Superset Dataset v11

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: fribb-dropin-builder-v8
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      # Restore the latest resumable working cache from previous runs.
      # restore-keys allows the newest prior cache to be used even though
      # each run saves under a unique key.
      - name: Restore resumable build cache
        uses: actions/cache/restore@v4
        with:
          path: .build-cache
          key: anime-mappings-v8-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            anime-mappings-v8-

      - name: Download source datasets
        shell: bash
        run: |
          set -euo pipefail

          download() {
            local output="$1"
            local primary="$2"
            local fallback="${3:-}"

            rm -f "$output"
            echo "Downloading $output"
            echo "Primary: $primary"

            if curl \
              --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 --max-time 900 \
              --user-agent "clix-anime-mappings/1.0 (GitHub Actions)" \
              "$primary" -o "$output"; then
              test -s "$output"
              echo "Downloaded $output from primary source ($(du -h "$output" | cut -f1))"
              return 0
            fi

            rm -f "$output"
            if [ -n "$fallback" ]; then
              echo "::warning::Primary download failed for $output. Trying fallback CDN/mirror."
              echo "Fallback: $fallback"
              curl \
                --fail --location --silent --show-error \
                --retry 5 --retry-delay 5 --retry-all-errors \
                --connect-timeout 30 --max-time 900 \
                --user-agent "clix-anime-mappings/1.0 (GitHub Actions)" \
                "$fallback" -o "$output"
              test -s "$output"
              echo "Downloaded $output from fallback ($(du -h "$output" | cut -f1))"
              return 0
            fi

            echo "::error::Failed to download $output"
            exit 1
          }

          # GitHub raw can occasionally return 403 from shared Actions runner IPs.
          # jsDelivr serves the same public repository files as a fallback.
          download \
            fribb-anime-list-full.json \
            "https://raw.githubusercontent.com/Fribb/anime-lists/master/anime-list-full.json" \
            "https://cdn.jsdelivr.net/gh/Fribb/anime-lists@master/anime-list-full.json"

          download \
            anime-and-manga-full.json \
            "https://raw.githubusercontent.com/anime-and-manga/lists/master/anime-full.json" \
            "https://cdn.jsdelivr.net/gh/anime-and-manga/lists@master/anime-full.json"

          # animeapi.my.id redirects the full dump to GitHub raw, so use the
          # repository database file via jsDelivr if that redirect is blocked.
          download \
            animeapi.json \
            "https://animeapi.my.id/animeApi.json" \
            "https://cdn.jsdelivr.net/gh/nattadasu/animeApi@v3/database/animeapi.json"

          # AniDB may reject datacenter/shared runner traffic. Use a public
          # cached mirror only when the official daily title dump is unavailable.
          download \
            anime-titles.xml.gz \
            "https://anidb.net/api/anime-titles.xml.gz" \
            "https://cdn.jsdelivr.net/gh/DaniGTA/PinguSync@master/anidb-anime-titles.xml.gz"

          download \
            anime-list-full.xml \
            "https://raw.githubusercontent.com/ScudLee/anime-lists/master/anime-list-full.xml" \
            "https://cdn.jsdelivr.net/gh/Anime-Lists/anime-lists@master/anime-list-full.xml"

          echo "Validating downloaded files..."
          python - <<'PYVALIDATE'
          import gzip, json, pathlib, xml.etree.ElementTree as ET

          json_files = [
              'fribb-anime-list-full.json',
              'anime-and-manga-full.json',
              'animeapi.json',
          ]
          for name in json_files:
              with open(name, 'r', encoding='utf-8') as f:
                  json.load(f)
              print(f'OK JSON: {name}')

          ET.parse('anime-list-full.xml')
          print('OK XML: anime-list-full.xml')

          with gzip.open('anime-titles.xml.gz', 'rb') as f:
              # Parse enough to prove this is a valid gzip/XML document.
              ET.parse(f)
          print('OK GZIP/XML: anime-titles.xml.gz')
          PYVALIDATE

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=incremental" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dataset
        env:
          BUILD_MODE: ${{ steps.mode.outputs.value }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAL_INTERVAL: "1.0"
          TMDB_INTERVAL: "0.08"
          ANILIST_INTERVAL: "0.75"
          ANILIST_BATCH: "50"
          ANILIST_DAILY_VERIFY: "1000"
        run: python build_fribb_dropin.py

      # Save checkpoints even if a later commit/push step fails.
      - name: Save resumable build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build-cache
          key: anime-mappings-v8-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit generated files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            anime-list-full.json \
            anime-list-mini.json \
            build-meta.json \
            build-diagnostics.json \
            build-state.json

          if git diff --cached --quiet; then
            echo "No dataset/state changes."
            exit 0
          fi

          git commit -m "chore: resumable smart anime mapping update"
          git pull --rebase
          git push

      - name: Publish databases to public repo
        if: success()
        env:
          PUBLIC_DATA_REPO: ${{ secrets.PUBLIC_DATA_REPO }}
          PUBLIC_DATA_TOKEN: ${{ secrets.PUBLIC_DATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PUBLIC_DATA_REPO:-}" ]; then
            echo "::error::Missing Actions secret: PUBLIC_DATA_REPO"
            exit 1
          fi

          if [ -z "${PUBLIC_DATA_TOKEN:-}" ]; then
            echo "::error::Missing Actions secret: PUBLIC_DATA_TOKEN"
            exit 1
          fi

          echo "Publishing generated databases to: ${PUBLIC_DATA_REPO}"
          rm -rf /tmp/clix-public-data
          git clone "https://x-access-token:${PUBLIC_DATA_TOKEN}@github.com/${PUBLIC_DATA_REPO}.git" /tmp/clix-public-data

          cd /tmp/clix-public-data

          # Public repo contains only distributable database artifacts/documentation.
          cp "$GITHUB_WORKSPACE/anime-list-full.json" ./anime-list-full.json
          cp "$GITHUB_WORKSPACE/anime-list-mini.json" ./anime-list-mini.json
          cp "$GITHUB_WORKSPACE/build-meta.json" ./build-meta.json

          if [ -f "$GITHUB_WORKSPACE/PUBLIC_README.md" ]; then
            cp "$GITHUB_WORKSPACE/PUBLIC_README.md" ./README.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add anime-list-full.json anime-list-mini.json build-meta.json README.md

          if git diff --cached --quiet; then
            echo "Public database repo already up to date."
          else
            git commit -m "Update anime mapping database"
            git push origin HEAD
          fi

