name: Build Fribb Superset Dataset v11

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: fribb-dropin-builder-v8
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      # Restore the latest resumable working cache from previous runs.
      # restore-keys allows the newest prior cache to be used even though
      # each run saves under a unique key.
      - name: Restore resumable build cache
        uses: actions/cache/restore@v4
        with:
          path: .build-cache
          key: anime-mappings-v8-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            anime-mappings-v8-

      - name: Download source datasets
        shell: bash
        run: |
          set -euo pipefail

          download() {
            local output="$1"
            local url="$2"

            rm -f "$output"
            echo "Downloading $output"
            echo "Source: $url"

            curl \
              --fail --location --silent --show-error \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 --max-time 900 \
              --user-agent "clix-anime-mappings/1.0 (GitHub Actions)" \
              "$url" -o "$output"

            test -s "$output"
            echo "Downloaded $output ($(du -h "$output" | cut -f1))"
          }

          # Official/original sources only. No CDN or third-party fallbacks.
          download \
            fribb-anime-list-full.json \
            "https://raw.githubusercontent.com/Fribb/anime-lists/master/anime-list-full.json"

          download \
            anime-and-manga-full.json \
            "https://raw.githubusercontent.com/anime-and-manga/lists/master/anime-full.json"

          download \
            animeapi.json \
            "https://animeapi.my.id/animeApi.json"

          # AniDB is downloaded with Python urllib instead of curl.
          # There is deliberately NO fallback/mirror. If the official source
          # returns 403 or otherwise fails, the workflow fails immediately.
          python - <<'PYANIDB'
          import pathlib
          import urllib.request

          url = "https://anidb.net/api/anime-titles.xml.gz"
          output = pathlib.Path("anime-titles.xml.gz")
          output.unlink(missing_ok=True)

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              ),
              "Accept": "*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://anidb.net/",
              "Connection": "close",
          }

          print(f"Downloading AniDB official titles: {url}")
          req = urllib.request.Request(url, headers=headers, method="GET")

          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  with output.open("wb") as f:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          f.write(chunk)
          except Exception:
              output.unlink(missing_ok=True)
              raise

          if not output.exists() or output.stat().st_size == 0:
              raise RuntimeError("AniDB download produced an empty file")

          print(f"Downloaded {output} ({output.stat().st_size / 1024 / 1024:.2f} MiB)")
          PYANIDB

          download \
            anime-list-full.xml \
            "https://raw.githubusercontent.com/ScudLee/anime-lists/master/anime-list-full.xml"

          echo "Validating downloaded files..."
          python - <<'PYVALIDATE'
          import gzip, json, xml.etree.ElementTree as ET

          json_files = [
              'fribb-anime-list-full.json',
              'anime-and-manga-full.json',
              'animeapi.json',
          ]
          for name in json_files:
              with open(name, 'r', encoding='utf-8') as f:
                  json.load(f)
              print(f'OK JSON: {name}')

          ET.parse('anime-list-full.xml')
          print('OK XML: anime-list-full.xml')

          with gzip.open('anime-titles.xml.gz', 'rb') as f:
              ET.parse(f)
          print('OK GZIP/XML: anime-titles.xml.gz')
          PYVALIDATE

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=incremental" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dataset
        env:
          BUILD_MODE: ${{ steps.mode.outputs.value }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAL_INTERVAL: "1.0"
          TMDB_INTERVAL: "0.08"
          ANILIST_INTERVAL: "0.75"
          ANILIST_BATCH: "50"
          ANILIST_DAILY_VERIFY: "1000"
        run: python build_fribb_dropin.py

      # Save checkpoints even if a later commit/push step fails.
      - name: Save resumable build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build-cache
          key: anime-mappings-v8-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit generated files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            anime-list-full.json \
            anime-list-mini.json \
            build-meta.json \
            build-diagnostics.json \
            build-state.json

          if git diff --cached --quiet; then
            echo "No dataset/state changes."
            exit 0
          fi

          git commit -m "chore: resumable smart anime mapping update"
          git pull --rebase
          git push

      - name: Publish anime-list-full.json to public repo
        if: success()
        env:
          PUBLIC_DATA_REPO: ${{ secrets.PUBLIC_DATA_REPO }}
          PUBLIC_DATA_TOKEN: ${{ secrets.PUBLIC_DATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PUBLIC_DATA_REPO:-}" ]; then
            echo "::error::Missing Actions secret: PUBLIC_DATA_REPO"
            exit 1
          fi

          if [ -z "${PUBLIC_DATA_TOKEN:-}" ]; then
            echo "::error::Missing Actions secret: PUBLIC_DATA_TOKEN"
            exit 1
          fi

          echo "Publishing anime-list-full.json to: ${PUBLIC_DATA_REPO}"
          rm -rf /tmp/clix-public-data
          git clone "https://x-access-token:${PUBLIC_DATA_TOKEN}@github.com/${PUBLIC_DATA_REPO}.git" /tmp/clix-public-data

          cd /tmp/clix-public-data
          cp "$GITHUB_WORKSPACE/anime-list-full.json" ./anime-list-full.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only this workflow's file. Do not delete or stage files
          # maintained by other workflows in the shared public repository.
          git add -- anime-list-full.json

          if git diff --cached --quiet; then
            echo "Public anime-list-full.json is already up to date."
            exit 0
          fi

          git commit -m "Update anime mapping database"

          branch="$(git branch --show-current)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push raced with another update; rebasing (attempt $attempt/5)..."
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep $((attempt * 2))
          done

          echo "Failed to publish after 5 attempts."
          exit 1
